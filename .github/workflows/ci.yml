name: EMRE test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sözdizimi kontrolü
        run: python -m compileall -q server.py ledger_tools.py arena_bridge.py ses_baglanti.py tts_piper_bridge.py yerel_isci.py openjarvis_yonet.py tests
      - name: Birim ve HTTP testleri
        run: python -m unittest discover -s tests -t . -v
