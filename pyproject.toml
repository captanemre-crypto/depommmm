# EMRE — geliştirme araçları yapılandırması (uygulama çalışması için gerekli değildir)
[tool.ruff]
target-version = "py311"
line-length = 160
exclude = [".venv-ses", ".venv-desktop", "sesler", "kodlar", "tools/e2e/node_modules"]

[tool.ruff.lint]
# Gerçek hatalara odaklan: pyflakes (F), import sırası (I), bugbear (B) ve
# pycodestyle hataları. Proje yoğun tek satır stili kullandığı için E701/E702
# (satır başına tek ifade) bilinçli olarak kapatıldı.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501", "E741", "E701", "E702", "B904", "B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.unittest]
start-dir = "tests"
